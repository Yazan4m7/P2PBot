services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://p2pbot:p2pbot@db:5432/p2pbot
      DEFAULT_FIAT: JOD
      DEFAULT_ASSET: USDT
      SCAN_INTERVAL_SECONDS: 10
      LIVE_MONEY_ACTIONS_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: p2pbot
      POSTGRES_USER: p2pbot
      POSTGRES_PASSWORD: p2pbot
    volumes:
      - p2pbot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2pbot -d p2pbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  p2pbot_db:
